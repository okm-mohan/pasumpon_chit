<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Member Portal | Pasumpon{% endblock %}</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" href="/static/css/member_portal.css?v=3"></head><body><aside class="mp-side"><a class="mp-brand" href="/member/dashboard"><img src="/static/images/logo.png" alt="Pasumpon"><span><b>Pasumpon</b><small>Member Portal</small></span></a><div class="mp-member"><img src="{{ member.photo or '/static/images/logo.png' }}" alt="Profile"><div><b>{{ member.member_name }}</b><small>{{ member.member_code }}</small></div></div><nav><span class="mp-nav-label">My space</span><a class="{% if active_member_page=='dashboard' %}active{% endif %}" href="/member/dashboard"><i class="bi bi-grid-1x2-fill"></i>My Dashboard</a><a class="{% if active_member_page=='inbox' %}active{% endif %}" href="/member/inbox"><i class="bi bi-chat-square-text-fill"></i>My Inbox <em>3</em></a><a class="{% if active_member_page=='maturity' %}active{% endif %}" href="/member/maturity"><i class="bi bi-award-fill"></i>Maturity</a><a class="{% if active_member_page=='calendar' %}active{% endif %}" href="/member/calendar"><i class="bi bi-calendar3-event-fill"></i>Calendar</a><a class="{% if active_member_page=='announcements' %}active{% endif %}" href="/member/announcements"><i class="bi bi-megaphone-fill"></i>Announcements</a><a class="{% if active_member_page=='documents' %}active{% endif %}" href="/member/documents"><i class="bi bi-folder2-open"></i>Documents</a><a class="{% if active_member_page=='benefits' %}active{% endif %}" href="/member/benefits"><i class="bi bi-gift-fill"></i>Benefits</a><a class="{% if active_member_page=='support' %}active{% endif %}" href="/member/support"><i class="bi bi-headset"></i>Help & Support</a><span class="mp-nav-label">Reports</span><a class="mp-sub {% if active_member_page=='monthly-statement' %}active{% endif %}" href="/member/monthly-statement">Monthly Statement</a><a class="mp-sub {% if active_member_page=='yearly-statement' %}active{% endif %}" href="/member/yearly-statement">Yearly Statement</a><a class="mp-sub {% if active_member_page=='payment-summary' %}active{% endif %}" href="/member/payment-summary">Payment Summary</a><a class="{% if active_member_page=='community' %}active{% endif %}" href="/member/community"><i class="bi bi-people-fill"></i>Community</a><a class="{% if active_member_page=='profile' %}active{% endif %}" href="/member/profile"><i class="bi bi-person-vcard-fill"></i>My Profile</a><a class="{% if active_member_page=='settings' %}active{% endif %}" href="/member/settings"><i class="bi bi-gear-fill"></i>Settings</a></nav><a class="mp-signout" href="/member/logout"><i class="bi bi-box-arrow-right"></i>Logout</a></aside><main class="mp-main">{% block content %}{% endblock %}</main></body></html>
