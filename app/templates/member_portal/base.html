<!doctype html>
<html lang="ta">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Member Portal | Pasumpon{% endblock %}</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" href="/static/css/member_portal.css?v=5"></head>
<body>
<aside class="mp-side"><a class="mp-brand" href="/member/dashboard"><img src="/static/images/logo.png" alt="Pasumpon"><span><b>Pasumpon</b><small>Member Portal</small></span></a><div class="mp-member"><img src="{{ member.photo or '/static/images/logo.png' }}" alt="Profile"><div><b>{{ member.member_name }}</b><small>{{ member.member_code }}</small></div></div><nav><span class="mp-nav-label">எனது பகுதி</span><a class="{% if active_member_page=='dashboard' %}active{% endif %}" href="/member/dashboard"><i class="bi bi-grid-1x2-fill"></i>எனது Dashboard</a><a class="{% if active_member_page=='inbox' %}active{% endif %}" href="/member/inbox"><i class="bi bi-chat-square-text-fill"></i>எனது Inbox <em>3</em></a><a class="{% if active_member_page=='status' %}active{% endif %}" href="/member/status"><i class="bi bi-clipboard2-check-fill"></i>எனது நிலை</a><a class="{% if active_member_page=='calendar' %}active{% endif %}" href="/member/calendar"><i class="bi bi-calendar3-event-fill"></i>Calendar</a><a class="{% if active_member_page=='announcements' %}active{% endif %}" href="/member/announcements"><i class="bi bi-megaphone-fill"></i>அறிவிப்புகள்</a><a class="{% if active_member_page=='documents' %}active{% endif %}" href="/member/documents"><i class="bi bi-folder2-open"></i>ஆவணங்கள்</a><a class="{% if active_member_page=='support' %}active{% endif %}" href="/member/support"><i class="bi bi-headset"></i>உதவி & ஆதரவு</a><a class="{% if active_member_page=='community' %}active{% endif %}" href="/member/community"><i class="bi bi-people-fill"></i>சமூகம்</a><a class="{% if active_member_page=='profile' %}active{% endif %}" href="/member/profile"><i class="bi bi-person-vcard-fill"></i>எனது சுயவிவரம்</a><a class="{% if active_member_page=='settings' %}active{% endif %}" href="/member/settings"><i class="bi bi-gear-fill"></i>அமைப்புகள்</a></nav><a class="mp-signout" href="/member/logout"><i class="bi bi-box-arrow-right"></i>வெளியேறு</a></aside><main class="mp-main">{% block content %}{% endblock %}</main><script src="/static/js/member_preferences.js?v=1"></script></body>
</html>
